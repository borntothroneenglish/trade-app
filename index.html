<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Trade Interpreter</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d2a;
            --card-border: #26334d;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #f43f5e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; touch-action: manipulation; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .rotate-180 { transform: rotate(180deg); }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
        }

        .title { font-size: 1rem; font-weight: 800; color: var(--accent-blue); }
        
        .api-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="password"] {
            background: #020617;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            width: 220px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-primary { background: #2563eb; border-color: #3b82f6; }
        .btn-danger { background: #e11d48; border-color: #f43f5e; }
        .btn-rotate { background: #334155; border-color: #475569; }

        .alert-box {
            display: none;
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid var(--accent-red);
            color: #fda4af;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .card-stack { display: flex; flex-direction: column; gap: 10px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
        }

        .card-header {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-sub);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .card-body {
            font-size: 1.25rem;
            line-height: 1.5;
            word-break: break-all;
        }

        .raw-box {
            border-style: dashed;
            background: #090e17;
            color: var(--text-sub);
        }

        .raw-body { font-size: 1rem; }
    </style>
</head>
<body>

<div id="appContainer" class="app-container">
    <header>
        <div class="title">🔒 PRIVATE TRADE INTERPRETER</div>
        <div class="api-input-group">
            <input type="password" id="apiKeyInput" placeholder="Gemini API Key 입력" />
            <button class="btn btn-rotate" onclick="toggleRotation()">🔄 180° 회전</button>
        </div>
    </header>

    <div id="alertBanner" class="alert-box">
        ⚠️ <strong>[경고]</strong> <span id="alertMsg"></span>
    </div>

    <div style="display: flex; gap: 10px;">
        <button id="micBtn" class="btn btn-primary" style="flex: 1; padding: 16px; font-size: 1.1rem;" onclick="toggleMic()">🎙 음성 인식 시작</button>
    </div>

    <div class="card-stack">
        <div class="card raw-box">
            <div class="card-header">음성 인식 원문 (STT Raw)</div>
            <div id="rawText" class="card-body raw-body">마이크 버튼을 누르고 말씀하세요.</div>
        </div>

        <div class="card">
            <div class="card-header">
                <span>🇰🇷 Business Korean</span>
                <span id="statusTag" style="color: var(--accent-green)">READY</span>
            </div>
            <div id="krText" class="card-body">-</div>
        </div>

        <div class="card">
            <div class="card-header">🇺🇸 Business English</div>
            <div id="enText" class="card-body">-</div>
        </div>

        <div class="card">
            <div class="card-header">🇱🇦 Lao (ພາສາລາວ)</div>
            <div id="laoText" class="card-body">-</div>
        </div>
    </div>
</div>

<script>
    let recognition = null;
    let isRecording = false;

    window.onload = () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
        
        document.getElementById('apiKeyInput').addEventListener('change', (e) => {
            localStorage.setItem('gemini_api_key', e.target.value.trim());
        });

        setupSpeechRecognition();
    };

    function toggleRotation() {
        document.getElementById('appContainer').classList.toggle('rotate-180');
    }

    function setupSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            showAlert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 브라우저를 사용해 주세요.");
            document.getElementById('micBtn').disabled = true;
            return;
        }

        try {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onstart = () => {
                isRecording = true;
                const btn = document.getElementById('micBtn');
                btn.innerText = "🛑 음성 인식 중단 (듣는 중...)";
                btn.className = "btn btn-danger";
                document.getElementById('rawText').innerText = "음성을 인식하고 있습니다...";
            };

            recognition.onresult = (event) => {
                let interim = '';
                let final = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        final += event.results[i][0].transcript;
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }

                const currentText = final || interim;
                document.getElementById('rawText').innerText = currentText;

                if (final) {
                    processWithGemini(final);
                }
            };

            recognition.onerror = (event) => {
                console.error("STT Error:", event.error);
                if (event.error === 'not-allowed') {
                    showAlert("마이크 접근 권한이 거부되었습니다. 브라우저 설정에서 마이크를 허용해 주세요.");
                } else if (event.error === 'no-speech') {
                    // 음성이 입력되지 않은 경우는 무시
                } else {
                    showAlert("음성 인식 오류: " + event.error);
                }
                stopMicUI();
            };

            recognition.onend = () => {
                stopMicUI();
            };
        } catch (e) {
            console.error("Initialization Error:", e);
            showAlert("음성 인식 초기화 실패: " + e.message);
        }
    }

    function stopMicUI() {
        isRecording = false;
        const btn = document.getElementById('micBtn');
        btn.innerText = "🎙 음성 인식 시작";
        btn.className = "btn btn-primary";
    }

    function toggleMic() {
        if (!recognition) {
            setupSpeechRecognition();
        }

        if (!isRecording) {
            try {
                recognition.start();
            } catch (e) {
                console.error("Start Error:", e);
                // 이미 시작된 경우 재설정
                recognition.stop();
                setTimeout(() => recognition.start(), 200);
            }
        } else {
            recognition.stop();
            stopMicUI();
        }
    }

    function showAlert(msg) {
        const alertBanner = document.getElementById('alertBanner');
        document.getElementById('alertMsg').innerText = msg;
        alertBanner.style.display = 'block';
    }

    async function processWithGemini(rawText) {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        if (!apiKey) {
            showAlert("Gemini API Key를 입력하세요.");
            return;
        }

        document.getElementById('krText').innerText = "...교정 및 번역 중...";
        document.getElementById('enText').innerText = "...";
        document.getElementById('laoText').innerText = "...";

        const systemPrompt = `You are a high-level commodities trading interpreter.
1. Clean Korean speech disfluencies and convert into polite, highly formal Business Korean.
2. Translate into concise, professional Business English.
3. Translate into formal Lao (ພາສາລາວ).
4. CRITICAL: NEVER alter numbers, quantities, prices, currencies, dates, Incoterms, or contract terms.

Return strictly JSON matching this structure:
{
  "cleaned_korean": "...",
  "english": "...",
  "lao": "...",
  "entities": ["100,000 MT", "CIF Korea", "USD 1,200"]
}`;

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `${systemPrompt}\n\nInput Text: ${rawText}` }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            const resultJson = JSON.parse(data.candidates[0].content.parts[0].text);
            renderResult(rawText, resultJson);

        } catch (err) {
            console.error(err);
            showAlert("API 호출 오류가 발생했습니다. 키를 확인하세요.");
        }
    }

    function renderResult(rawText, data) {
        const alertBanner = document.getElementById('alertBanner');
        alertBanner.style.display = 'none';

        const rawNumbers = rawText.match(/\d+/g) || [];
        const translatedText = `${data.english} ${data.lao}`;
        const translatedNumbers = translatedText.match(/\d+/g) || [];

        const missingNumbers = rawNumbers.filter(n => !translatedNumbers.includes(n));

        if (missingNumbers.length > 0) {
            showAlert(`원문의 수치(${missingNumbers.join(', ')})가 번역에서 누락되었을 수 있습니다.`);
            document.getElementById('statusTag').innerText = "WARNING";
            document.getElementById('statusTag').style.color = "var(--accent-red)";
        } else {
            document.getElementById('statusTag').innerText = "VERIFIED";
            document.getElementById('statusTag').style.color = "var(--accent-green)";
        }

        document.getElementById('krText').innerHTML = data.cleaned_korean;
        document.getElementById('enText').innerHTML = data.english;
        document.getElementById('laoText').innerHTML = data.lao;
    }
</script>
</body>
</html>
