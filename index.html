<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Trade Interpreter</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(21, 30, 48, 0.7);
            --card-border: rgba(56, 189, 248, 0.2);
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #fb7185;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; touch-action: manipulation; }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: radial-gradient(circle at top center, #111827 0%, #080c14 100%);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .rotate-180 { transform: rotate(180deg); }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .api-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="password"] {
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            width: 180px;
            outline: none;
        }

        .lang-selector {
            display: flex;
            gap: 6px;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .lang-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            backdrop-filter: blur(8px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-color: #60a5fa;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e11d48, #be123c);
            border-color: #f87171;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
            animation: pulse 1.5s infinite;
        }

        .btn-retranslate {
            background: linear-gradient(135deg, #059669, #10b981);
            border-color: #34d399;
            color: #ffffff;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 8px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .btn-rotate {
            background: rgba(51, 65, 85, 0.6);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .alert-box {
            display: none;
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid var(--accent-red);
            color: #fda4af;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            word-break: break-all;
            line-height: 1.5;
        }

        .card-stack { display: flex; flex-direction: column; gap: 14px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--accent-blue);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-body {
            font-size: 1.65rem;
            font-weight: 600;
            line-height: 1.5;
            word-break: break-all;
            color: #ffffff;
        }

        .raw-box {
            border: 1px dashed rgba(56, 189, 248, 0.4);
            background: rgba(10, 15, 26, 0.8);
        }

        .raw-box .card-header { color: var(--text-sub); }

        .raw-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #cbd5e1;
            font-size: 1.25rem;
            font-family: inherit;
            font-weight: 400;
            resize: vertical;
            outline: none;
            min-height: 70px;
            line-height: 1.5;
        }

        .raw-textarea:focus {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
        }

        .badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
        }
        
        .badge-ready { background: rgba(74, 222, 128, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-warn { background: rgba(251, 113, 133, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
    </style>
</head>
<body>

<div id="appContainer" class="app-container">
    <header>
        <div class="title">🔒 PRIVATE TRADE INTERPRETER</div>
        <div class="api-input-group">
            <input type="password" id="apiKeyInput" placeholder="Gemini API Key" />
            <button class="btn btn-rotate" onclick="toggleRotation()">🔄 180° 회전</button>
        </div>
    </header>

    <div id="alertBanner" class="alert-box">
        ⚠️ <strong>[오류 상세]</strong> <br><span id="alertMsg"></span>
    </div>

    <div class="lang-selector">
        <button id="lang-ko" class="lang-btn active" onclick="setLanguage('ko-KR', 'lang-ko')">🇰🇷 한국어 말하기</button>
        <button id="lang-en" class="lang-btn" onclick="setLanguage('en-US', 'lang-en')">🇺🇸 English</button>
        <button id="lang-lo" class="lang-btn" onclick="setLanguage('lo-LA', 'lang-lo')">🇱🇦 ພາສາລາວ</button>
    </div>

    <div style="display: flex; gap: 10px;">
        <button id="micBtn" class="btn btn-primary" style="flex: 1; padding: 20px; font-size: 1.3rem;" onclick="toggleMic()">🎙 음성 인식 시작</button>
    </div>

    <div class="card-stack">
        <div class="card raw-box">
            <div class="card-header">
                <span>✏️ 원문 (누적 입력 중)</span>
                <button class="btn btn-retranslate" onclick="retranslateManual()">⚡ 수동 번역 실행</button>
            </div>
            <textarea id="rawInput" class="raw-textarea" placeholder="마이크를 켜고 편하게 말씀하세요. 말씀이 끝나면 '🛑 완료' 버튼을 누르시면 됩니다."></textarea>
        </div>

        <div class="card">
            <div class="card-header">
                <span>🇰🇷 Business Korean</span>
                <span id="statusTag" class="badge badge-ready">READY</span>
            </div>
            <div id="krText" class="card-body">-</div>
        </div>

        <div class="card">
            <div class="card-header">🇺🇸 Business English</div>
            <div id="enText" class="card-body">-</div>
        </div>

        <div class="card">
            <div class="card-header">🇱🇦 Lao (ພາສາລາວ)</div>
            <div id="laoText" class="card-body">-</div>
        </div>
    </div>
</div>

<script>
    let recognition = null;
    let isRecording = false;
    let currentLang = 'ko-KR';
    let finalTranscript = ''; // 누적 텍스트 저장을 위한 변수

    window.onload = () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
        
        document.getElementById('apiKeyInput').addEventListener('change', (e) => {
            localStorage.setItem('gemini_api_key', e.target.value.trim());
        });

        setupSpeechRecognition();
    };

    function toggleRotation() {
        document.getElementById('appContainer').classList.toggle('rotate-180');
    }

    function setLanguage(langCode, btnId) {
        currentLang = langCode;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(btnId).classList.add('active');
        
        if (recognition) {
            recognition.lang = currentLang;
        }
    }

    function setupSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            showAlert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 브라우저를 사용해 주세요.");
            document.getElementById('micBtn').disabled = true;
            return;
        }

        try {
            recognition = new SpeechRecognition();
            // 연속 인식 옵션을 true로 설정하여 중간 끊김 방지
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = currentLang;

            recognition.onstart = () => {
                isRecording = true;
                finalTranscript = '';
                const btn = document.getElementById('micBtn');
                btn.innerText = "🛑 음성 인식 완료 및 번역";
                btn.className = "btn btn-danger";
                document.getElementById('rawInput').value = "";
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                document.getElementById('rawInput').value = finalTranscript + interimTranscript;
            };

            recognition.onerror = (event) => {
                console.error("STT Error:", event.error);
                if (event.error === 'not-allowed') {
                    showAlert("마이크 접근 권한이 거부되었습니다.");
                } else if (event.error !== 'no-speech') {
                    showAlert("음성 인식 오류: " + event.error);
                }
            };

            // 안드로이드 크롬 등에서 강제로 끊어졌을 때 지속적으로 녹음 중이면 자동 재시작
            recognition.onend = () => {
                if (isRecording) {
                    try {
                        recognition.start();
                    } catch (e) {
                        stopMicUI();
                    }
                } else {
                    stopMicUI();
                }
            };
        } catch (e) {
            showAlert("음성 인식 초기화 실패: " + e.message);
        }
    }

    function stopMicUI() {
        isRecording = false;
        const btn = document.getElementById('micBtn');
        btn.innerText = "🎙 음성 인식 시작";
        btn.className = "btn btn-primary";
    }

    function toggleMic() {
        if (!recognition) setupSpeechRecognition();

        if (!isRecording) {
            try {
                recognition.lang = currentLang;
                recognition.start();
            } catch (e) {
                recognition.stop();
                setTimeout(() => {
                    recognition.lang = currentLang;
                    recognition.start();
                }, 200);
            }
        } else {
            // 녹음 중단 누르면 마이크 끄고 누적된 텍스트 전체 번역 실행
            isRecording = false;
            recognition.stop();
            stopMicUI();
            
            const textToTranslate = document.getElementById('rawInput').value.trim();
            if (textToTranslate) {
                processWithGemini(textToTranslate);
            }
        }
    }

    function retranslateManual() {
        const text = document.getElementById('rawInput').value.trim();
        if (text) {
            processWithGemini(text);
        }
    }

    function showAlert(msg) {
        const alertBanner = document.getElementById('alertBanner');
        document.getElementById('alertMsg').innerText = msg;
        alertBanner.style.display = 'block';
    }

    async function processWithGemini(rawText) {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        if (!apiKey) {
            showAlert("Gemini API Key를 상단 입력 칸에 넣어야 합니다.");
            return;
        }

        document.getElementById('krText').innerText = "...교정 및 번역 중...";
        document.getElementById('enText').innerText = "...";
        document.getElementById('laoText').innerText = "...";

        const systemPrompt = `You are a high-level commodities trading interpreter.
1. The input text can be in Korean, English, or Lao. Identify the source language.
2. Clean disfluencies and convert/translate into polite, highly formal Business Korean.
3. Translate into concise, professional Business English.
4. Translate into formal Lao (ພາສາລາວ).
5. CRITICAL: NEVER alter numbers, quantities, prices, currencies, dates, Incoterms, or contract terms.

Return strictly JSON matching this structure:
{
  "cleaned_korean": "...",
  "english": "...",
  "lao": "...",
  "entities": ["100,000 MT", "CIF Korea", "USD 1,200"]
}`;

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `${systemPrompt}\n\nInput Text (${currentLang}): ${rawText}` }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                const errMsg = errData.error ? errData.error.message : response.statusText;
                showAlert(`HTTP ${response.status} 오류: ${errMsg}`);
                return;
            }

            const data = await response.json();
            const resultJson = JSON.parse(data.candidates[0].content.parts[0].text);
            renderResult(rawText, resultJson);

        } catch (err) {
            showAlert("네트워크/호출 예외 발생: " + err.message);
        }
    }

    function renderResult(rawText, data) {
        const alertBanner = document.getElementById('alertBanner');
        alertBanner.style.display = 'none';

        const rawNumbers = rawText.match(/\d+/g) || [];
        const translatedText = `${data.english} ${data.lao}`;
        const translatedNumbers = translatedText.match(/\d+/g) || [];

        const missingNumbers = rawNumbers.filter(n => !translatedNumbers.includes(n));
        const statusTag = document.getElementById('statusTag');

        if (missingNumbers.length > 0) {
            showAlert(`원문의 수치(${missingNumbers.join(', ')})가 번역에서 누락되었을 수 있습니다.`);
            statusTag.innerText = "WARNING";
            statusTag.className = "badge badge-warn";
        } else {
            statusTag.innerText = "VERIFIED";
            statusTag.className = "badge badge-ready";
        }

        document.getElementById('krText').innerHTML = data.cleaned_korean;
        document.getElementById('enText').innerHTML = data.english;
        document.getElementById('laoText').innerHTML = data.lao;
    }
</script>
</body>
</html>
